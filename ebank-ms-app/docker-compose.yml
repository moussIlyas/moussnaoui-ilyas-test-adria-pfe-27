# ==============================================================================
#  Ebank - COMPLETE stack: MariaDB, Kafka, Keycloak and all Spring services.
#  Base file = safe defaults (no host ports published).
#
#  DEV  (dev profile, every service reachable on 127.0.0.1):
#    docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build --wait
#
#  PROD (pro profile, hardened, only the gateway is published):
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait
#
#  Images can be pulled from a registry instead of built locally:
#    IMAGE_PREFIX=registry.example.com/ebank IMAGE_TAG=1.2.3 docker compose up -d --no-build
#
#  How configuration flows (identical to the IDE layout):
#    ./config-repo  ->  mounted read-only at /app/config-repo.
#                       Each jar runs in WORKDIR /app/<module> and imports
#                       ../config-repo/global.properties +
#                       ../config-repo/<name>-<profile>.properties (see each
#                       module's application.properties) - same files as always.
#    ./.env         ->  injected as real OS env vars (env_file). Inside a
#                       container ../.env does not exist, so the
#                       optional:file:../.env import no-ops and the OS env vars
#                       win. DB_HOST and the Eureka URL are overridden below
#                       because "localhost" would be the container itself.
# ==============================================================================
name: ebank-ms

x-app: &app
  env_file:
    - .env
  environment:
    # JSON property names are exact -> no env-var spelling pitfalls for the
    # container-only overrides (Eureka URL from config-repo/global.properties
    # + register a routable container IP instead of a random hostname).
    SPRING_APPLICATION_JSON: |-
      {
        "eureka": {
          "client": {
            "service-url": { "defaultZone": "http://discovery-service:8761/eureka" }
          },
          "instance": {
            "prefer-ip-address": true
          }
        }
      }
    DB_HOST: mariadb
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    SPRING_CLOUD_CONFIG_URI: http://config-service:8888
    # Used only by ebank-bot's MCP client; harmless for the other services.
    ACCOUNT_SERVICE_URL: http://account-service:8057
    TRANSACTION_SERVICE_URL: http://transaction-service:8056
    TZ: UTC
  volumes:
    - ./config-repo:/app/config-repo:ro
  networks:
    - ebank
  restart: unless-stopped
  stop_grace_period: 30s
  logging: &app-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-app-healthcheck: &app-healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 40s

services:
  # ------------------------------------------------------------- database --
  # docker/init-db.sh (docker-entrypoint-initdb.d) creates transactions-db,
  # accounts-db and the app user on the FIRST start of an empty volume.
  # Credentials come from .env - never from the image or this file.
  mariadb:
    image: mariadb:11.8
    container_name: ebank-mariadb
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?missing - copy .env.example to .env}
      DB_USERNAME: ${DB_USERNAME:?missing - copy .env.example to .env}
      DB_PASSWORD: ${DB_PASSWORD:?missing - copy .env.example to .env}
      MARIADB_AUTO_UPGRADE: "true"
      TZ: UTC
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - ebank
    logging: *app-logging

  # ----------------------------------------------------------------- kafka --
  # Single KRaft broker (no ZooKeeper). Host clients use localhost:29092,
  # containers use kafka:19092.
  kafka:
    image: apache/kafka:4.4.0
    container_name: ebank-kafka
    hostname: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:29092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:29092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      TZ: UTC
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - ebank
    logging: *app-logging

  # -------------------------------------------------------------- keycloak --
  # Started but not wired into the APIs yet; kept for the identity/OIDC part.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: ebank-keycloak
    restart: unless-stopped
    command: ["start-dev", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      TZ: UTC
    volumes:
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - ebank
    logging: *app-logging

  # ------------------------------------------------------------- services --
  # Spring Cloud Config Server, native backend on the mounted config-repo/.
  config-service:
    <<: *app
    image: ${IMAGE_PREFIX:-ebank-ms}/config-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: .
        PORT: 8888
    container_name: ebank-config
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health"]

  discovery-service:
    <<: *app
    image: ${IMAGE_PREFIX:-ebank-ms}/discovery-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: discovery-service
        PORT: 8761
    container_name: ebank-discovery
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]

  gateway-service:
    <<: *app
    image: ${IMAGE_PREFIX:-ebank-ms}/gateway-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: gateway-service
        PORT: 9999
    container_name: ebank-gateway
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:9999/actuator/health"]

  transaction-service:
    <<: *app
    image: ${IMAGE_PREFIX:-ebank-ms}/transaction-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: transaction-service
        PORT: 8056
    container_name: ebank-transaction
    depends_on:
      config-service:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8056/actuator/health"]

  account-service:
    <<: *app
    image: ${IMAGE_PREFIX:-ebank-ms}/account-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: account-service
        PORT: 8057
    container_name: ebank-account
    depends_on:
      config-service:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8057/actuator/health"]

  ebank-bot:
    <<: *app
    image: ${IMAGE_PREFIX:-ebank-ms}/ebank-bot:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: ebank-bot
        PORT: 8058
    container_name: ebank-bot
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      # MCP clients are initialized at startup, so both tool servers must be ready.
      account-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8058/actuator/health"]

  # ------------------------------------------------------------- react web --
  # Vite build served by Nginx; /api/ is proxied to the gateway (same-origin,
  # so no CORS). Standalone service: no config-repo mount, no Spring env.
  ebank-web:
    image: ${IMAGE_PREFIX:-ebank-ms}/ebank-web:${IMAGE_TAG:-local}
    build:
      context: ./ebank-web
      dockerfile: Dockerfile
    container_name: ebank-web
    depends_on:
      gateway-service:
        condition: service_healthy
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
    networks:
      - ebank
    restart: unless-stopped
    stop_grace_period: 10s
    logging: *app-logging

networks:
  ebank:

volumes:
  mariadb-data:
  kafka-data:
  keycloak-data:
