spring.application.name=transaction-service
spring.profiles.active=dev

# Real settings live in ../config-repo/ (or in the config-service). Secrets come from ../.env.
spring.config.import=optional:configserver:http://localhost:8888,\
  optional:file:../.env[.properties],\
  optional:file:../config-repo/application.properties,\
  optional:file:../config-repo/global.properties,\
  optional:file:../config-repo/${spring.application.name}-${spring.profiles.active}.properties
