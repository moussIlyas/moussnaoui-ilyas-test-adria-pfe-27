# Unit-test profile: in-memory database, no config server, Eureka or Kafka.
spring.config.import=optional:configserver:http://127.0.0.1:1
spring.application.name=transaction-service
spring.datasource.url=jdbc:h2:mem:transactions;MODE=MariaDB;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.kafka.listener.auto-startup=false
spring.kafka.admin.fail-fast=false
eureka.client.enabled=false
