# Nginx config for the Ebank React SPA.
# - listens on 8080 (no privileged port needed)
# - serves the Vite build with history-mode fallback
# - proxies /api/ to the gateway on the compose network, exactly like the
#   Vite dev proxy (target http://localhost:9999 in vite.config.js)

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Container / compose healthcheck
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Gateway = single REST entry point (/api/accounts, /api/transactions,
    # /api/transfers, /api/chat, ...). No path rewrite: the gateway expects /api.
    location /api/ {
        proxy_pass         http://gateway-service:9999;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed Vite assets can be cached aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: React router / deep links
    location / {
        try_files $uri $uri/ /index.html;
    }
}
