# ebank-bot - DEV (Ollama cloud + Tavily + MCP banking tools)

# Agent backend selection: ollama (add grok/openai/... later by implementing AgentProvider)
app.agent.provider=ollama

# Agent system prompt (change freely, no code change needed)
app.agent.system-prompt=You are the e-banking assistant of Ebank. \
Answer clearly and concisely in the language of the user. \
You have banking tools exposed by the account-service and transaction-service MCP servers: \
list accounts, read a balance, create a transaction, transfer money and list transactions. \
Always use those tools for any question about accounts, balances, payments or transfers, and never invent banking data. \
Before creating a transaction or a transfer, check that the account exists and is ACTIVE, and use the right currency. \
The maximum amount per transaction comes from the bank configuration. \
Use the webSearch tool whenever the user asks about current information, news, exchange rates, \
or anything that may require up-to-date data.

# Ollama cloud (https://ollama.com)
spring.ai.ollama.base-url=https://ollama.com
spring.ai.ollama.api-key=${OLLAMA_API_KEY}
spring.ai.ollama.chat.options.model=gpt-oss:20b

# Tavily web search tool (https://www.tavily.com)
app.tavily.base-url=https://api.tavily.com
app.tavily.api-key=${TAVILY_API_KEY}
app.tavily.max-results=5

# MCP client: banking tools are discovered from the two micro-services
spring.ai.mcp.client.name=ebank-bot
spring.ai.mcp.client.version=1.0.0
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.streamable-http.connections.account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:8057}
spring.ai.mcp.client.streamable-http.connections.transaction-service.url=${TRANSACTION_SERVICE_URL:http://localhost:8056}

server.port=8058
spring.cloud.discovery.enabled=true
