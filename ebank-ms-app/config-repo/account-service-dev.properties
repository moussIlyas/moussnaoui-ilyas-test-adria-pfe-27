# account-service - DEV
server.port=8057
spring.cloud.discovery.enabled=true
# Database (MariaDB service from docker-compose.yml)
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:3306/accounts-db
spring.datasource.username=${DB_USERNAME:ebank}
spring.datasource.password=${DB_PASSWORD:ebank}
spring.jpa.hibernate.ddl-auto=update

# MCP server consumed by ebank-bot
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.name=account-service
spring.ai.mcp.server.version=1.0.0

# Kafka consumer for bank.transactions.created (logging only)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=account-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.mouss.accountservice.messaging.TransactionCreatedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=*
