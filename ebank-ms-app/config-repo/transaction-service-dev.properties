# transaction-service - DEV
server.port=8056
spring.cloud.discovery.enabled=true

# Database (MariaDB service from docker-compose.yml)
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:3306/transactions-db
spring.datasource.username=${DB_USERNAME:ebank}
spring.datasource.password=${DB_PASSWORD:ebank}
spring.jpa.hibernate.ddl-auto=update

# OpenFeign + Resilience4j towards account-service
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=5000
resilience4j.circuitbreaker.instances.accountService.sliding-window-size=10
resilience4j.circuitbreaker.instances.accountService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accountService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.accountService.permitted-number-of-calls-in-half-open-state=3
resilience4j.timelimiter.instances.accountService.timeout-duration=5s

# MCP server consumed by ebank-bot
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.name=transaction-service
spring.ai.mcp.server.version=1.0.0

# Kafka producer for bank.transactions.created
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.template.default-topic=bank.transactions.created
