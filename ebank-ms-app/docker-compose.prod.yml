# ==============================================================================
#  PROD overlay - run TOGETHER with docker-compose.yml:
#
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait
#
#  - forces SPRING_PROFILES_ACTIVE=pro (config-repo/<service>-pro.properties)
#  - only the web client (80) and the gateway (9999) are published: the web
#    client is the user entry point, the gateway the API entry point
#    (Eureka, the services and MariaDB stay on the internal network)
#  - JVM containers are hardened: read-only root filesystem (+ tmpfs /tmp),
#    no capabilities, no-new-privileges
#  - memory limits per service; the JVM sizes its heap from the cgroup limit
#    (-XX:MaxRAMPercentage in the Dockerfile)
#  - .env must exist on the host with production values (never committed);
#    on a real cluster replace env_file with your secret manager's env injection
# ==============================================================================
x-prod-mode: &prod-mode
  environment:
    SPRING_PROFILES_ACTIVE: pro
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp

services:
  mariadb:
    deploy:
      resources:
        limits:
          memory: 1g

  kafka:
    deploy:
      resources:
        limits:
          memory: 1g

  keycloak:
    deploy:
      resources:
        limits:
          memory: 1g

  config-service:
    <<: *prod-mode
    deploy:
      resources:
        limits:
          memory: 512m

  discovery-service:
    <<: *prod-mode
    deploy:
      resources:
        limits:
          memory: 512m

  gateway-service:
    <<: *prod-mode
    ports:
      - "9999:9999"
    deploy:
      resources:
        limits:
          memory: 512m

  transaction-service:
    <<: *prod-mode
    deploy:
      resources:
        limits:
          memory: 768m

  account-service:
    <<: *prod-mode
    deploy:
      resources:
        limits:
          memory: 768m

  ebank-bot:
    <<: *prod-mode
    deploy:
      resources:
        limits:
          memory: 768m

  # Nginx runs unprivileged (port 8080 in the container) so cap_drop/read_only
  # are safe; only its cache and pid directories are writable (tmpfs).
  ebank-web:
    ports:
      - "80:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    deploy:
      resources:
        limits:
          memory: 128m
