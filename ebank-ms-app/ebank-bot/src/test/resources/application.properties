# Unit-test profile: no external LLM, web search or MCP server is contacted.
# A local import satisfies Spring Cloud's config-import check without config-server.
spring.config.import=optional:configserver:http://127.0.0.1:1
spring.application.name=ebank-bot
app.agent.provider=ollama
app.agent.system-prompt=test
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.api-key=test
app.tavily.base-url=http://localhost
app.tavily.api-key=test
app.tavily.max-results=1
spring.ai.mcp.client.enabled=false
eureka.client.enabled=false
